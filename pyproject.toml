[project]
name = "lite-harness"
version = "0.9.0"
description = "A small, structured agent harness for studying and validating tool-using LLM agent architectures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117.0",
    "google-genai>=2.14.0",
    "langchain-openai>=1.4.1",
    "openai>=2.44.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
